name: test-orders

on:
  pull_request:
    paths:
      - apps/orders/**
      - apps/common/**
     
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: cd apps && npm ci
      - run: cd apps && npm run build -w @ticketing/common
      - run: cd apps && npm run test -w @ticketing/orders
    
